name: Go CI

on:
  push:
    branches-ignore:
      - renovate/**
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

jobs:

  windows_skillsync:
    name: Windows skills synchronization
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Enforce Windows skills-sync platform coverage
        shell: pwsh
        run: |
          $coveragePath = Join-Path $PWD 'coverage-windows.out'
          go test "-coverprofile=$coveragePath" ./skillsync
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          go test ./skillsync/reexec ./skillsync/selfupdate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $coverage = go tool cover "-func=$coveragePath"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $platform = @($coverage | Select-String 'sync_directory_windows.go')
          if ($platform.Count -lt 4) {
            throw "Windows directory-sync functions were not present in coverage output"
          }
          $uncovered = @($platform | Where-Object { $_.ToString() -notmatch '\s100\.0%$' })
          if ($uncovered.Count -ne 0) {
            throw "Windows directory-sync coverage is incomplete: $uncovered"
          }

  # daemonlifecycle's detach, pipe-EOF and process-identity tests exercise
  # each OS's own process model, so they run natively on all three. cgo is off
  # to prove the start-time lookups need no C toolchain.
  daemonlifecycle:
    name: Daemon lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test daemonlifecycle
        run: go test -count=1 -v ./daemonlifecycle

  strongo_workflow:
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    permissions:
      contents: write
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    with:
      code_coverage: true
      # Version bumping and tagging belong to release.yml, which also builds
      # the reference CLI's release artifacts. Leaving it on here too would
      # give one push to main two independent bumpers racing for the next tag.
      disable-version-bumping: true
      # This module reached 100% on the commit that introduced it, and its
      # whole purpose is replacing users' binaries — the one code path where an
      # untested branch has no safe failure mode. The floor is the number, not
      # a margin below it.
      min_test_coverage_percent: 100

  # Fail fast on go.mod/go.sum drift.
  #
  # This is the signal that would have caught datatug-cli's v0.13.2 before it
  # shipped: two renovate pull requests for the same major bump interleaved and
  # left go.mod requiring a version nothing imported. Build-and-test caught the
  # stale imports only after both had merged; an untidy go.mod is visible on the
  # FIRST of the pair, on its own pull request.
  #
  # `-diff` only reports; it never rewrites go.mod, so unlike a mutating
  # `go mod tidy` it cannot mask the drift it is meant to find. This job belongs
  # to the workflow named by release.yml's `require_workflow_success`, so drift
  # also blocks the release, not just the merge.
  go-mod-tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Must be >= this repo's go.mod `go` directive.
          go-version: '1.26.0'
          cache: true
      - name: go mod tidy -diff
        run: go mod tidy -diff
