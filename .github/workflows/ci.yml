name: Go CI

on:
  push:
    branches-ignore:
      - renovate/**
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

jobs:

  windows_skillsync:
    name: Windows skills synchronization
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Exercise native durability and enforce platform coverage
        shell: pwsh
        run: |
          go test ./skillsync -coverprofile=coverage-windows.out
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          go test ./skillsync/reexec ./skillsync/selfupdate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $coverage = go tool cover '-func=coverage-windows.out'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $platform = @($coverage | Select-String 'sync_directory_windows.go')
          if ($platform.Count -lt 4) {
            throw "Windows directory-sync functions were not present in coverage output"
          }
          $uncovered = @($platform | Where-Object { $_.ToString() -notmatch '\s100\.0%$' })
          if ($uncovered.Count -ne 0) {
            throw "Windows directory-sync coverage is incomplete: $uncovered"
          }

  strongo_workflow:
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    permissions:
      contents: write
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    with:
      code_coverage: true
      # Version bumping and tagging belong to release.yml, which also builds
      # the reference CLI's release artifacts. Leaving it on here too would
      # give one push to main two independent bumpers racing for the next tag.
      disable-version-bumping: true
      # This module reached 100% on the commit that introduced it, and its
      # whole purpose is replacing users' binaries — the one code path where an
      # untested branch has no safe failure mode. The floor is the number, not
      # a margin below it.
      min_test_coverage_percent: 100
