name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it in one run. Pushing an explicit `vX.Y.Z` tag also works and
# releases that exact version (the shared workflow skips the bump on a tag
# ref).
#
# This module publishes plain GitHub release archives only (see
# .goreleaser.yml) — no Homebrew cask, Scoop bucket, or WinGet manifest — so
# none of the shared workflow's optional cross-repo publish secrets
# (GORELEASER_GITHUB_TOKEN, WINGET_GITHUB_TOKEN, AUR_SSH_PRIVATE_KEY) are
# needed: the default GITHUB_TOKEN this job already has under
# `permissions: contents: write` is sufficient for GoReleaser to create the
# release itself.
#
# cli-helpers is pre-1.0: allow_major_version_bump stays false, so a stray
# `feat!:` is capped to a minor bump instead of jumping to v1.0.0.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Pinned to an exact tag. The moving @v1 tag has been retired: it drifted
    # 14 patch releases behind while still accepting newer inputs, so a
    # configured release gate silently did nothing.
    uses: strongo/cicd/.github/workflows/release.yml@v1.18.0
    permissions:
      contents: write
      # Lets the require_workflow_success guard read the quality
      # workflow's result for this commit. A reusable workflow cannot
      # grant itself more than its caller allows, so it belongs here.
      actions: read
    with:
      # Refuse to tag or publish unless this repo's quality workflow
      # passed for this exact commit. Release and that workflow are
      # siblings started by the same push, with no cross-workflow
      # `needs:` between them, so before this a red suite could not
      # stop a release. datatug-cli shipped v0.13.2 that way. Names
      # the workflow's `name:`, not its filename.
      require_workflow_success: 'Go CI'
      allow_major_version_bump: false
